<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap');

  /* ===== RESET & ROOT VARIABLES ===== */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #2E7D32;
    --primary-dark: #1B5E20;
    --primary-light: #E8F5E9;
    --secondary: #66BB6A;
    --white: #FFFFFF;
    --text: #212121;
    --text-muted: #5F6368;
    --border: #DCDCDC;
    --danger: #C62828;
    --font-heading: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 12px;
    --radius-btn: 24px;
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
    --transition: 0.2s ease;
  }

  /* ===== FULLSCREEN TAKEOVER CONTAINER ===== */
  #app-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999999;
    background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 45%, #388E3C 75%, #43A047 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px;
    font-family: var(--font-body);
    color: var(--text);
    box-sizing: border-box;
  }

  /* Ambient decorative circles */
  #app-wrapper::before {
    content: '';
    position: absolute;
    top: -20%;
    right: -10%;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  #app-wrapper::after {
    content: '';
    position: absolute;
    bottom: -15%;
    left: -10%;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ===== LOGIN CARD CONTAINER ===== */
  .login-container {
    width: 100%;
    max-width: 360px;
    /* margin: auto vertikal & horizontal tanpa memotong bagian atas di layar rendah */
    margin: auto;
    position: relative;
    z-index: 10;
    padding: 6px 0 12px;
    animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-card {
    background: var(--white);
    border-radius: 16px;
    padding: 22px 20px 16px;
    box-shadow: var(--shadow);
  }

  /* Header & Logo */
  .login-header {
    text-align: center;
    margin-bottom: 14px;
  }

  .login-header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .login-logo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-heading);
    font-size: 19px;
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--primary);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    flex-shrink: 0;
  }

  .admin-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .login-title {
    font-family: var(--font-heading);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
    line-height: 1.25;
  }

  .login-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.35;
  }

  /* ===== ALERTS ===== */
  .login-alert {
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
    align-items: flex-start;
    gap: 7px;
    line-height: 1.4;
  }

  .login-alert.show {
    display: flex;
  }

  .alert-error {
    background: #FFEBEE;
    color: var(--danger);
    border: 1px solid #FFCDD2;
  }

  .alert-success {
    background: var(--primary-light);
    color: var(--primary-dark);
    border: 1px solid #A5D6A7;
  }

  /* ===== FORM FIELDS ===== */
  .form-group {
    margin-bottom: 11px;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: #333333;
    margin-bottom: 3px;
    font-family: var(--font-heading);
  }

  .input-wrapper {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-wrapper input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text);
    background: var(--white);
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
    box-sizing: border-box;
  }

  .input-wrapper input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2.5px rgba(46, 125, 50, 0.12);
  }

  .input-wrapper input::placeholder {
    color: #BDBDBD;
    font-size: 12.5px;
  }

  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color var(--transition);
  }

  .password-toggle:hover {
    color: var(--primary);
  }

  /* ===== BUTTONS ===== */
  .btn-login {
    width: 100%;
    padding: 10px 14px;
    background: var(--primary);
    color: #ffffff;
    font-family: var(--font-heading);
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 13px;
    box-shadow: 0 3px 10px rgba(46, 125, 50, 0.22);
  }

  .btn-login:hover:not(:disabled) {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(46, 125, 50, 0.3);
  }

  .btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-spinner {
    display: none;
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }

  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .btn-spinner { display: block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== CARD FOOTER & BACK LINK ===== */
  .login-card-footer {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #ECECEC;
    text-align: center;
  }

  .login-card-footer p {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    margin: 0;
  }

  .login-card-footer strong {
    color: var(--primary);
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.95);
    text-decoration: none;
    transition: all var(--transition);
    padding: 5px 12px;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.16);
  }

  .back-home:hover {
    color: #ffffff;
    background: rgba(0, 0, 0, 0.28);
    transform: translateX(-2px);
  }

  @media (max-width: 480px) {
    .login-card {
      padding: 18px 16px 14px;
      border-radius: 14px;
    }
  }
</style>

<div id="app-wrapper">

  <div class="login-container">
    <div class="login-card">

      <!-- Header Kompak & Elegan -->
      <div class="login-header">
        <div class="login-header-top">
          <a href="/" class="login-logo" id="logoLink">
            <div class="logo-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>

        <span id="alertErrorMsg">Email atau password salah. Silakan coba lagi.</span>
      </div>

      <!-- Alert Notifikasi Sukses -->
      <div class="login-alert alert-success" id="alertSuccess">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>

<!-- SCRIPT AUTENTIKASI SUPABASE                                  -->
<!-- ============================================================ -->
<script>
  // 1. SUPABASE CONFIGURATION
  const SUPABASE_URL = 'https://abeqqbahcigexjwmklqn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WCHTRDOVsPJj8Cb1ykIJLw_DE6_v7dR';

  // 2. URL HELPERS
  function getDashboardUrl() {
    const isBlogger = window.location.pathname.includes('/p/') || window.location.hostname.includes('blogspot.com');
    return isBlogger ? '/p/admin-dashboard.html' : 'admin-dashboard.html';
  }

  function getHomeUrl() {
    const isBlogger = window.location.pathname.includes('/p/') || window.location.hostname.includes('blogspot.com');
    return isBlogger ? '/' : 'page-beranda.html';
  }

  // 3. SESSION HELPERS
  function saveSession(data) {
    localStorage.setItem('go_tani_admin_session', JSON.stringify(data));
  }
  function getSession() {
    try {
      const raw = localStorage.getItem('go_tani_admin_session');
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  // 4. CEK APAKAH SUDAH LOGIN SEBELUMNYA
  (function checkAutoRedirect() {
    const session = getSession();
    if (session && session.access_token && session.expires_at && Date.now() < session.expires_at) {
      window.location.href = getDashboardUrl();
    }
  })();

  // 5. SEMBUNYIKAN NAVBAR & FOOTER BLOGGER JIKA ADA
  (function hideBloggerThemeElements() {
    const nav = document.getElementById('mainNavbar');
    const foot = document.getElementById('mainFooter');
    if (nav) nav.style.display = 'none';
    if (foot) foot.style.display = 'none';
  })();

  // 6. TOGGLE PASSWORD VISIBILITY (EYE ICON)
  const toggleBtn = document.getElementById('togglePassword');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      const input = document.getElementById('adminPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        // Eye Off (dicoret)
        icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
      } else {
        input.type = 'password';
        // Eye Open (terbuka)
        icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    });
  }

  // 7. SUBMIT FORM LOGIN KE SUPABASE
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn = document.getElementById('loginBtn');
      const alertError = document.getElementById('alertError');
      const alertSuccess = document.getElementById('alertSuccess');
      const alertErrorMsg = document.getElementById('alertErrorMsg');

      // Reset tampilan alert
      alertError.classList.remove('show');
      alertSuccess.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        // Request login resmi ke Supabase Auth
        const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          const rawErrMsg = data.msg || data.error_description || data.message || data.error || 'Autentikasi gagal';
          throw new Error(rawErrMsg);
        }

        // Jika berhasil, simpan session token
        saveSession({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          user: data.user,
          expires_at: Date.now() + ((data.expires_in || 3600) * 1000)
        });

        // Tampilkan pesan sukses
        alertSuccess.classList.add('show');

        // Pengalihan ke Dashboard Admin
        setTimeout(() => {
          window.location.href = getDashboardUrl();
        }, 800);

      } catch (error) {
        console.error('Login Supabase Error:', error);

        // Terjemahan pesan error yang manusiawi
        const msgLower = (error.message || '').toLowerCase();
        if (msgLower.includes('invalid') || msgLower.includes('credential') || msgLower.includes('grant')) {
          alertErrorMsg.textContent = 'Email atau kata sandi tidak cocok. Silakan periksa kembali.';
        } else if (msgLower.includes('confirm') || msgLower.includes('not confirmed')) {
          alertErrorMsg.textContent = 'Email ini belum dikonfirmasi di Supabase. Buka Supabase > Authentication > Users untuk mengkonfirmasi akun.';
        } else if (msgLower.includes('not found')) {
          alertErrorMsg.textContent = 'Akun admin dengan email ini belum terdaftar di Supabase.';
        } else {
          alertErrorMsg.textContent = error.message || 'Terjadi gangguan koneksi ke database. Silakan coba lagi.';
        }

        alertError.classList.add('show');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  }
</script>
